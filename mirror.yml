
name: mirror

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download assets
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          import urllib.parse
          from pathlib import Path

          SITE = "https://www.cho-kaguyahime.com/"
          OUT = Path("site")
          seen = set()

          def get(u):
              r = urllib.request.Request(
                  u, headers={"User-Agent": "Mozilla/5.0"}
              )
              return urllib.request.urlopen(r, timeout=60).read()

          def save(rel, data):
              p = OUT / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              return p

          def fetch(u):
              u = u.split("#")[0].split("?")[0]

              if u in seen or not u.startswith(SITE):
                  return

              seen.add(u)

              try:
                  d = get(u)
              except Exception as e:
                  print("FAIL", u, e)
                  return

              p = save(u[len(SITE):] or "index.html", d)
              print("OK", u)

              if u.endswith(".png"):
                  fetch(u[:-4] + ".webp")

              if p.suffix in (".css", ".js", ".html"):
                  t = d.decode("utf-8", "ignore")

                  for m in re.findall(r'url\(["\']?([^)"\']+)', t):
                      if not m.startswith("data:"):
                          fetch(urllib.parse.urljoin(u, m))

                  for m in re.findall(
                      r'https://www\.cho-kaguyahime\.com/[^\s"\'()<>\\]+', t
                  ):
                      fetch(m)

                  for m in re.findall(
                      r'["\'](assets/[^"\'?\s]+\.\w+)', t
                  ):
                      fetch(SITE + m)

          fetch(SITE)

          for f in [
              "assets/css/common.css",
              "assets/css/top.css",
              "assets/js/libs/jquery-3.6.0.min.js",
              "assets/js/libs/jquery.easing.min.js",
              "assets/js/incparts.js",
              "assets/js/jquery.common.js",
              "assets/js/jquery.top.js"
          ]:
              fetch(SITE + f)

          for n in range(12):
              for k in [
                  "thumb", "thumb-ac", "name", "name-en",
                  "main", "main_sp", "main_2", "main_2_sp",
                  "main_3", "main_3_sp"
              ]:
                  for ext in ["webp", "png", "svg"]:
                      fetch(
                          f"{SITE}assets/img/character/character_{n}{k}.{ext}"
                      )

          for ext in ["css", "js"]:
              save(
                  f"vendor/swiper-bundle.min.{ext}",
                  get(f"https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.{ext}")
              )

          PY

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "mirror assets" || echo "no changes"
          git push
