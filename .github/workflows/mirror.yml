name: mirror

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "取得するページのURL(複数ならスペース区切り)"
        required: true
        default: "https://www.cho-kaguyahime.com/ https://www.cho-kaguyahime.com/movie/"
      api_urls:
        description: "追加で取得するAPIのURL(スペース区切り。既定の5件は常に取得)"
        required: false
        default: ""
      extra_urls:
        description: "追加で取得するファイルのURL(画像など。スペース区切り)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download assets
        env:
          URLS: ${{ inputs.urls || 'https://www.cho-kaguyahime.com/ https://www.cho-kaguyahime.com/movie/' }}
          API_URLS: ${{ inputs.api_urls }}
          EXTRA_URLS: ${{ inputs.extra_urls }}
        run: |
          python3 - <<'PY'
          import os, re, json, hashlib, mimetypes
          import html as H
          import urllib.request, urllib.parse
          from html.parser import HTMLParser
          from pathlib import Path

          PAGES = os.environ["URLS"].split()
          MAIN = urllib.parse.urlparse(PAGES[0]).netloc
          OUT = Path("site")
          LIMIT = 6000
          MAXB = 20_000_000

          DEFAULT_API = [
              "https://www.news.cho-kaguyahime.com/wp-json/wp/v2/posts?acf_format=standard&context=embed&per_page=1&page=1",
              "https://www.news.cho-kaguyahime.com/wp-json/wp/v2/pages/131?acf_format=standard",
              "https://www.news.cho-kaguyahime.com/wp-json/wp/v2/mv?acf_format=standard&context=embed&per_page=10&page=1",
              "https://www.news.cho-kaguyahime.com/wp-json/wp/v2/movie?acf_format=standard&context=embed&per_page=10&page=1",
              "https://www.news.cho-kaguyahime.com/wp-json/wp/v2/posts?acf_format=standard&context=embed&per_page=3&page=1",
          ]
          APIS = DEFAULT_API + os.environ.get("API_URLS", "").split()
          EXTRAS = os.environ.get("EXTRA_URLS", "").split()

          SKIP = re.compile(
              r"googletagmanager|google-analytics|doubleclick|googlesyndication|"
              r"facebook\.net|clarity\.ms|typekit\.net|"
              r"youtube\.com/(?:iframe_api|embed|watch)", re.I)

          EXT = (r"(?:png|jpe?g|gif|webp|avif|svg|ico|bmp|css|js|mjs|json|"
                 r"woff2?|ttf|otf|eot|mp4|webm|mp3|ogg|wav|glb|gltf|wasm)")
          STOP = r'''\s"'`()<>\\,'''
          ABS_RE = re.compile(
              r"(?:https?:)?//[^" + STOP + r"]+?\." + EXT +
              r"(?:\?[^" + STOP + r"]*)?(?=[" + STOP + r"]|$)", re.I)
          API_RE = re.compile(
              r"https?://[^" + STOP + r"]+/(?:wp-json|api)/[^" + STOP + r"]*", re.I)
          REL_RE = re.compile(
              r'''["'`]((?:\.{0,2}/)?(?:[\w\-.%@]+/)+[\w\-.%@]+\.''' + EXT +
              r'''(?:\?[^"'`\s]*)?)["'`]''', re.I)
          CSS_URL_RE = re.compile(r'''url\(\s*["']?([^)"']+?)["']?\s*\)''')
          IMPORT_RE = re.compile(r'''@import\s+["']([^"']+)["']''')
          PATHLIKE = re.compile(r'''^[^\s"'<>]{1,300}\.''' + EXT + r'''(?:\?\S*)?$''', re.I)
          PROBE = re.compile(r"^(.*[^0-9/])(\d{1,2})(\.(?:png|jpe?g|webp|svg|gif))$", re.I)

          seen = set()
          MAPPING = {}
          LOCAL = {}
          HDR = {}
          todo = []

          def q(u):
              return urllib.parse.quote(u, safe=":/?&=%#+@~,;!$*()'[]")

          def req(u):
              r = urllib.request.Request(
                  q(u), headers={"User-Agent": "Mozilla/5.0", "Referer": PAGES[0]})
              return urllib.request.urlopen(r, timeout=60)

          def save(rel, data):
              p = OUT / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)

          def local(key, ctype):
              p = urllib.parse.urlparse(key)
              suf = Path(urllib.parse.unquote(p.path)).suffix.lower()
              if not re.fullmatch(r"\.[a-z0-9]{1,6}", suf):
                  suf = ({"text/css": ".css", "application/json": ".json",
                          "text/javascript": ".js", "application/javascript": ".js"}.get(ctype)
                         or mimetypes.guess_extension(ctype) or ".bin")
              if (p.netloc == MAIN and re.fullmatch(r"/[A-Za-z0-9_./%@+-]+", p.path)
                      and Path(p.path).suffix):
                  return p.path.lstrip("/")
              return "ext/" + hashlib.sha1(key.encode()).hexdigest()[:12] + suf

          # HTML側ローダーの apiName() と同じ規則で名前を作る
          def api_name(u):
              p = urllib.parse.urlparse(u)
              path = p.path.lstrip("/")
              qs = "&".join(x for x in p.query.split("&") if x and not x.startswith("_="))
              return "api/" + re.sub(r"[^A-Za-z0-9]+", "_", path + "?" + qs).strip("_") + ".json"

          def refs_in(text):
              out = [m.group(0) for m in ABS_RE.finditer(text)]
              out += API_RE.findall(text)
              out += REL_RE.findall(text)
              out += CSS_URL_RE.findall(text)
              out += IMPORT_RE.findall(text)
              return out

          def strings(o):
              if isinstance(o, str):
                  yield o
              elif isinstance(o, dict):
                  for v in o.values():
                      yield from strings(v)
              elif isinstance(o, list):
                  for v in o:
                      yield from strings(v)

          def add(ref, base):
              ref = H.unescape(ref.strip())
              if not ref or ref.startswith(("data:", "#", "javascript:", "mailto:", "tel:", "blob:")):
                  return
              u = urllib.parse.urljoin(base, ref).split("#")[0]
              if u.startswith("http"):
                  todo.append(u)

          def scan_json(text):
              try:
                  obj = json.loads(text)
              except Exception:
                  obj = None
              if obj is None:
                  for r in refs_in(text):
                      add(r, PAGES[0])
                  return
              for s in strings(obj):
                  if len(s) < 300 and PATHLIKE.match(s):
                      add(s, PAGES[0])
                  for r in refs_in(s):
                      add(r, PAGES[0])

          def handle(u):
              key = u.split("?")[0]
              if key in seen or SKIP.search(u) or len(seen) >= LIMIT:
                  return
              seen.add(key)
              try:
                  resp = req(u)
                  data = resp.read()
                  ctype = resp.headers.get_content_type()
              except Exception as e:
                  print("FAIL", u, e)
                  return
              suf0 = Path(urllib.parse.unquote(urllib.parse.urlparse(key).path)).suffix.lower()
              if ctype == "text/html" and suf0 not in (".html", ".htm"):
                  print("SKIP(html)", u)
                  return
              if len(data) > MAXB:
                  print("SKIP(too big)", u, len(data))
                  return
              rel = local(key, ctype)
              save(rel, data)
              LOCAL[key] = rel
              MAPPING[key] = rel
              print("OK", u, "->", rel)
              if re.search(r"swiper-bundle\.min\.(css|js)$", key):
                  save("vendor/" + key.rsplit("/", 1)[-1], data)
              if urllib.parse.urlparse(key).netloc == MAIN:
                  low = key.lower()
                  if low.endswith((".png", ".jpg", ".jpeg")):
                      add(key.rsplit(".", 1)[0] + ".webp", key)
                  elif low.endswith(".webp"):
                      add(key.rsplit(".", 1)[0] + ".png", key)
              ext = Path(rel).suffix.lower()
              if ext not in (".css", ".js", ".mjs", ".json", ".html", ".htm"):
                  return
              text = data.decode("utf-8", "ignore")
              if ext == ".json":
                  scan_json(text)
              else:
                  base = u if ext == ".css" else PAGES[0]
                  for r in refs_in(text):
                      add(r, base)

          def drain():
              while todo:
                  handle(todo.pop())

          # API取得。ページ数ヘッダーを記録し、2ページ目以降も自動で取得する
          def fetch_api(u, follow=True):
              rel = api_name(u)
              try:
                  resp = req(u)
                  data = resp.read()
                  total = int(resp.headers.get("X-WP-Total") or 0)
                  pages = int(resp.headers.get("X-WP-TotalPages") or 0)
              except Exception as e:
                  print("FAIL api", u, e)
                  return
              save(rel, data)
              LOCAL["api:" + u] = rel
              if pages:
                  HDR[rel] = {"total": total, "pages": pages}
              print("OK api", u, "->", rel, "pages:", pages)
              scan_json(data.decode("utf-8", "ignore"))
              if follow and pages > 1 and re.search(r"([?&])page=\d+", u):
                  for n in range(2, min(pages, 30) + 1):
                      fetch_api(re.sub(r"([?&])page=\d+", r"\g<1>page=%d" % n, u), follow=False)

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.refs, self.css, self.js = [], [], []
              def handle_starttag(self, tag, attrs):
                  a = {k: (v or "") for k, v in attrs}
                  if tag != "iframe":
                      for k in ("src", "data-src", "poster", "data-bg", "data-background"):
                          if a.get(k):
                              self.refs.append(a[k])
                  if tag == "script" and a.get("src"):
                      self.js.append(a["src"])
                  if tag == "link" and a.get("href"):
                      rel = set(a.get("rel", "").lower().split())
                      if rel & {"stylesheet", "icon", "shortcut", "apple-touch-icon", "preload",
                                "prefetch", "modulepreload", "manifest", "mask-icon"}:
                          self.refs.append(a["href"])
                          if "stylesheet" in rel:
                              self.css.append(a["href"])
                  for k in ("srcset", "data-srcset"):
                      for part in a.get(k, "").split(","):
                          tok = part.strip().split(" ")[0]
                          if tok:
                              self.refs.append(tok)

          def keyof(ref, page):
              return urllib.parse.urljoin(page, H.unescape(ref.strip())).split("#")[0].split("?")[0]

          manifest = {}
          for page in PAGES:
              try:
                  raw = req(page).read().decode("utf-8", "ignore")
              except Exception as e:
                  print("FAIL page", page, e)
                  continue
              p = P()
              p.feed(raw)
              for r in p.refs:
                  add(r, page)
              for r in refs_in(raw):
                  add(r, page)
              drain()
              manifest[page] = {
                  "css": [LOCAL[k] for k in (keyof(r, page) for r in p.css) if k in LOCAL],
                  "js": [LOCAL[k] for k in (keyof(r, page) for r in p.js) if k in LOCAL],
              }

          for u in APIS:
              fetch_api(u)
          for u in EXTRAS:
              add(u, PAGES[0])
          drain()

          # 末尾が数字の画像(gnav_c3.png など)は、番号違いも試す
          for key in list(LOCAL):
              if urllib.parse.urlparse(key).netloc != MAIN:
                  continue
              m = PROBE.match(key)
              if m:
                  add(m.group(1) + m.group(3), key)
                  for n in range(21):
                      add(m.group(1) + str(n) + m.group(3), key)
          drain()

          # 取得したJSON内のURLを、GitHub(jsDelivr)の配信先に書き換える
          CDN = "https://cdn.jsdelivr.net/gh/" + os.environ.get("GITHUB_REPOSITORY", "") + "@main/site/"
          NORM = {urllib.parse.unquote(k): v for k, v in MAPPING.items()}

          def rw(s):
              def r(m):
                  t = m.group(0)
                  if t.startswith("//"):
                      t = "https:" + t
                  hit = NORM.get(urllib.parse.unquote(t.split("?")[0]))
                  return CDN + hit if hit else m.group(0)
              return ABS_RE.sub(r, s)

          def walk(o):
              if isinstance(o, str):
                  return rw(o)
              if isinstance(o, dict):
                  return {k: walk(v) for k, v in o.items()}
              if isinstance(o, list):
                  return [walk(v) for v in o]
              return o

          for key, rel in list(LOCAL.items()):
              if rel.endswith(".json"):
                  fp = OUT / rel
                  try:
                      obj = json.loads(fp.read_text("utf-8"))
                  except Exception:
                      continue
                  fp.write_text(json.dumps(walk(obj), ensure_ascii=False), "utf-8")

          save("api/_headers.json", json.dumps(HDR, ensure_ascii=False, indent=1).encode("utf-8"))
          save("map.json", json.dumps(MAPPING, ensure_ascii=False, indent=1).encode("utf-8"))
          save("manifest.json", json.dumps(manifest, ensure_ascii=False, indent=1).encode("utf-8"))
          print("files:", len(MAPPING))
          PY

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "mirror assets" || echo "no changes"
          git push
