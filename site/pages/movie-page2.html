<script>
(async () => {
  // ★自分のリポジトリ(jsDelivr経由)。raw を使う場合は下の行に差し替え
  const BASE = "https://cdn.jsdelivr.net/gh/umaimann/cpk_gh@main/site/";
  // const BASE = "https://raw.githubusercontent.com/umaimann/cpk_gh/main/site/";

  const ORIG = "https://www.cho-kaguyahime.com/";
  let MAP = {}; // 外部URL(ニュース画像・YouTubeサムネ等) → site/内のパス

  // map.json(Actionsが作成)を読む。無くても続行
  try {
    const r = await fetch(BASE + "map.json");
    if (r.ok) MAP = await r.json();
  } catch (e) {}

  // APIのページ数情報(Actionsが作成)。ページ送り表示に使われる
  let HDR = {};
  try {
    const r = await fetch(BASE + "api/_headers.json");
    if (r.ok) HDR = await r.json();
  } catch (e) {}

  const keys = Object.keys(MAP);
  const dec = s => { try { return decodeURI(s); } catch (e) { return s; } };
  const MAPN = {};
  for (const k of keys) MAPN[dec(k)] = MAP[k];
  // ニュースサイトのAPI → site/api/*.json(ymlと同じ名前規則。_=… は無視)
  const apiRe = /^https?:\/\/(?:www\.)?news\.cho-kaguyahime\.com\/(wp-json\/[^#]*)$/;
  const apiName = s => {
    const m = s.match(apiRe);
    if (!m) return null;
    const i = m[1].indexOf("?");
    const p = i < 0 ? m[1] : m[1].slice(0, i);
    const qs = (i < 0 ? "" : m[1].slice(i + 1)).split("&").filter(x => x && !x.startsWith("_=")).join("&");
    return "api/" + (p + "?" + qs).replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "") + ".json";
  };
  const fix = s => {
    if (typeof s !== "string" || !s.includes("http")) return s;
    const an = apiName(s);
    if (an) return BASE + an;
    for (const k of keys) {
      if (s.includes(k)) s = s.split(k).join(BASE + MAP[k]);
    }
    s = s.split(ORIG).join(BASE);
    // 文字列全体が1つのURLなら、エンコードの違いも吸収
    if (/^https?:\/\/\S+$/.test(s) && !s.startsWith(BASE)) {
      const hit = MAPN[dec(s.split("?")[0])];
      if (hit) s = BASE + hit;
    }
    return s;
  };

  // 画面に失敗したURLを出す(原因調べ用。不要なら削除してOK)
  const logBox = document.createElement("pre");
  logBox.style.cssText = "position:fixed;z-index:99999;left:0;bottom:0;max-width:100%;max-height:30vh;overflow:auto;margin:0;padding:4px;background:rgba(255,255,255,.9);color:#c00;font-size:10px;white-space:pre-wrap;display:none";
  document.body.appendChild(logBox);
  const log = m => { logBox.style.display = "block"; logBox.textContent += m + "\n"; };
  window.addEventListener("error", e => {
    const t = e.target;
    if (t && (t.src || t.href)) log("LOAD FAIL: " + (t.currentSrc || t.src || t.href));
  }, true);

  // new Image().src = ... / img.src = ... でも付け替える
  const d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
  if (d && d.set) {
    Object.defineProperty(HTMLImageElement.prototype, "src", {
      configurable: true,
      get: d.get,
      set(v) {
        if (!this.__w) {
          this.__w = 1;
          this.addEventListener("error", () => log("IMG FAIL: " + this.src));
        }
        d.set.call(this, fix(v));
      }
    });
  }
  // fetch / XMLHttpRequest のURLも付け替える
  const _fetch = window.fetch.bind(window);
  window.fetch = (r, o) => {
    const u = typeof r === "string" ? fix(r) : r;
    return _fetch(u, o).then(res => {
      if (!res.ok) log("FETCH " + res.status + ": " + (typeof u === "string" ? u : res.url));
      return res;
    });
  };
  const _open = XMLHttpRequest.prototype.open;
  const _gah = XMLHttpRequest.prototype.getAllResponseHeaders;
  const _grh = XMLHttpRequest.prototype.getResponseHeader;
  XMLHttpRequest.prototype.getAllResponseHeaders = function () {
    let h = _gah.call(this) || "";
    const x = this.__api && HDR[this.__api];
    if (x) h += "x-wp-total: " + x.total + "\r\nx-wp-totalpages: " + x.pages + "\r\n";
    return h;
  };
  XMLHttpRequest.prototype.getResponseHeader = function (n) {
    const x = this.__api && HDR[this.__api];
    if (x) {
      const l = String(n).toLowerCase();
      if (l === "x-wp-total") return String(x.total);
      if (l === "x-wp-totalpages") return String(x.pages);
    }
    return _grh.call(this, n);
  };
  XMLHttpRequest.prototype.open = function (m, u, ...a) {
    this.__api = typeof u === "string" ? apiName(u) : null;
    const nu = typeof u === "string" ? fix(u) : u;
    this.addEventListener("loadend", () => {
      if (this.status >= 400 || this.status === 0) log("XHR " + this.status + ": " + nu);
    });
    return _open.call(this, m, nu, ...a);
  };

  // 画像など: src / srcset / style を付け替え
  const ATTRS = ["src", "srcset", "style"];
  const fixEl = el => {
    if (!el || el.nodeType !== 1) return;
    for (const a of ATTRS) {
      const v = el.getAttribute(a);
      if (v) {
        const n = fix(v);
        if (n !== v) el.setAttribute(a, n);
      }
    }
  };
  const fixTree = n => {
    fixEl(n);
    if (n.querySelectorAll) n.querySelectorAll("[src],[srcset],[style]").forEach(fixEl);
  };
  fixTree(document.body);
  // JSが後から追加・変更する要素も付け替える
  new MutationObserver(ms => {
    for (const m of ms) {
      if (m.type === "attributes") fixEl(m.target);
      else m.addedNodes.forEach(fixTree);
    }
  }).observe(document.documentElement, {
    childList: true, subtree: true, attributes: true, attributeFilter: ATTRS
  });

  document.body.dataset.rt = BASE;

  async function css(path) {
    const url = BASE + path;
    const res = await fetch(url);
    if (!res.ok) throw new Error(path + " (" + res.status + ")");
    let t = fix(await res.text());
    t = t.replace(/url\((["']?)([^)"']+)\1\)/g, (m, q, u) =>
      /^(data:|#|https?:)/.test(u) ? m : `url("${new URL(u, url).href}")`);
    const s = document.createElement("style");
    s.textContent = t;
    document.head.appendChild(s);
  }

  async function js(path) {
    const res = await fetch(BASE + path);
    if (!res.ok) throw new Error(path + " (" + res.status + ")");
    const t = fix(await res.text());
    const s = document.createElement("script");
    s.textContent = t;
    document.body.appendChild(s);
  }

  try {
    await css("vendor/swiper-bundle.min.css");
    await css("assets/css/common.css");
    await css("assets/css/movie.css");
    await js("assets/js/libs/jquery-3.6.0.min.js");
    await js("assets/js/libs/jquery.easing.min.js");
    await js("vendor/swiper-bundle.min.js");
    await js("assets/js/incparts.js");
    await js("assets/js/jquery.common.js");
    await js("assets/js/jquery.movie.js");
    window.dispatchEvent(new Event("load"));
  } catch (e) {
    document.body.insertAdjacentHTML("afterbegin",
      '<pre style="position:fixed;z-index:99999;top:0;left:0;right:0;background:#fff;color:red;white-space:pre-wrap">読み込み失敗: ' + e + "</pre>");
  }
})();
</script>

<script>
// ページ送り: 「1」を押したとき、ページ移動せずにGitHubのHTMLを取得して、このページを置き換える
(function () {
  var TARGET_LABEL = '1';
  var TARGET_PAGE = ''; // 移動先のページ番号。1ページ目は空
  var TARGET_URL = 'https://cdn.jsdelivr.net/gh/umaimann/cpk_gh@main/site/pages/movie-page.html';
  function setPageParam(p) {
    try {
      var u = new URL(location.href);
      if (p) { u.searchParams.set('page', p); u.searchParams.delete('cpk'); }
      else { u.searchParams.delete('page'); u.searchParams.set('cpk', '1'); }
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    } catch (e) {}
  }
  // 差し替え済みの fetch / XHR / img.src を元に戻す(移動先で二重にかかるのを防ぐ)
  function restoreNatives() {
    var n = window.__cpkNative; if (!n) return;
    try {
      window.fetch = n.fetch;
      XMLHttpRequest.prototype.open = n.open;
      XMLHttpRequest.prototype.getAllResponseHeaders = n.gah;
      XMLHttpRequest.prototype.getResponseHeader = n.grh;
      if (n.imgSrc) Object.defineProperty(HTMLImageElement.prototype, 'src', n.imgSrc);
    } catch (e) {}
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('#pnav a');
    if (!a || a.textContent.trim() !== TARGET_LABEL) return;
    e.preventDefault();
    e.stopPropagation();
    fetch(TARGET_URL, { cache: 'no-cache' })
      .then(function (res) { if (!res.ok) throw new Error(res.status); return res.text(); })
      .then(function (html) {
        try { if (window.jQuery) { jQuery(window).off(); jQuery(document).off(); } } catch (err) {}
        restoreNatives();
        setPageParam(TARGET_PAGE);
        document.open(); document.write(html); document.close(); window.scrollTo(0, 0);
      })
      .catch(function (err) { console.error('ページの取得に失敗:', err); location.href = TARGET_URL; });
  }, true);
})();
</script>
